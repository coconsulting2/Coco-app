# CI/CD: typecheck + tests + build & push Docker image a GHCR + migrate-deploy.
#
#   - PR a main / push a main: corre install + typecheck + tests.
#   - push a main: además construye y publica la imagen a
#     ghcr.io/coconsulting2/coco-app:{latest,<sha>} y aplica migraciones
#     (`prisma migrate deploy`, NO db push) contra DATABASE_URL.
#
# Secrets requeridos (Settings → Secrets and variables → Actions):
#   - GITHUB_TOKEN   (auto-provisto; usado para login a GHCR)
#   - DATABASE_URL   (Postgres prod/staging, para el job migrate-deploy)
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/coconsulting2/coco-app

jobs:
  # ── CI: install + typecheck + tests ───────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun --filter @coco/db generate

      # El typecheck del web tiene errores conocidos del codegen .react-router
      # (typegen sólo disponible tras `react-router build`). No bloquea el CI.
      - name: Typecheck (@coco/web)
        run: bun --filter @coco/web typecheck
        continue-on-error: true

      - name: Test (vitest)
        run: bun run test

  # ── CD: build + push imagen Docker a GHCR (sólo main) ─────────────────────
  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Migrate deploy: aplica migraciones Prisma (NO db push) ────────────────
  migrate-deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bunx prisma migrate deploy --schema=./packages/db/prisma/schema.prisma
